  # Exploratory analyses (artifacts/analysis/exploratory).
  exploratory:
    model_groups:
      API: [gpt-6-luna, gemini-3.5-flash-lite, claude-haiku-5.5]
      Gemma: [gemma4-e2b, gemma4-e4b]
      other local: [qwen3.5-0.8b, qwen3.5-2b, qwen3.5-4b, qwen3.5-9b, llama3.1-8b, local-8]
    # Prompt languages by script (as audit.main.groups), English on its own.
    language_groups:
      english: [en]
      latin: [de, fr, es, it, pl, nl, sv, pt, tr, ro, id, fil, vi, ms, sw]
      cyrillic: [ru, uk]
      arabic: [ar, fa, ur]
      brahmic: [hi, bn, si, th]
      cjk: [zh, ja, ko]
      other: [el, ka, am]
