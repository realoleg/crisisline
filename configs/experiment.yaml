# Paths, seeds and the settings of every stage.

# Paths are relative to the repository root.
paths:
  countries: data/countries.csv
  resources: data/resources.csv
  resources_v1: data/resources_v1.csv  # ground truth v1; build reads only this
  shared_numbers: data/shared_numbers.csv
  generations: artifacts/generations
  robustness_generations: artifacts/robustness/generations
  main_audit: data/annotations/main_audit.csv
  main_audit_targeted: data/annotations/main_audit_targeted.csv
  main_audit_changed: data/annotations/main_audit_changed.csv
  unknowns_head: data/annotations/unknowns_head.csv
  unknowns_flags: data/annotations/unknowns_flags.csv
  unknowns_sample_2_4: data/annotations/unknowns_sample_2-4.csv
  unknowns_sample_1: data/annotations/unknowns_sample_1.csv
  unknowns_sample_flagged: data/annotations/unknowns_sample_flagged.csv
  scores: artifacts/scores.parquet
  scores_prefix: artifacts/scores_prefix.parquet  # extraction before the audit's fixes
  unknowns: artifacts/unknowns.csv
  fabrication_estimate: artifacts/fabrication_estimate.json
  scores_v1: artifacts/scores_v1.parquet  # ground truth v1 with the same labels
  unknowns_v1: artifacts/unknowns_v1.csv
  scores_prelabels: artifacts/scores_prelabels.parquet  # ground truth v1, before any label
  unknowns_prelabels: artifacts/unknowns_prelabels.csv
  valid_outside_scope: data/annotations/valid_outside_scope.csv
  analysis: artifacts/analysis
  paper: artifacts/paper  # figures, tables and numbers of the paper, from the analysis
  unknown_labels: data/annotations/unknown_labels.csv
  prompts_config: configs/prompts.yaml
  models_config: configs/models.yaml
  translations: data/translations
  prompts: artifacts/prompts.jsonl
  m2_resources: artifacts/m2_resources.csv
  # Natural Earth 1:110m admin-0 countries v5.1.2 (public domain), for the world map; source in
  # the README.
  world_map: data/ne_110m_admin_0_countries.geojson
  # Every file reproduce writes and how its end checks it; reference copies next to it.
  golden: checks/golden/manifest.yaml

audit:
  # Extraction audit: a random sample over all prompt languages for precision and recall, and
  # targeted responses that show the two known patterns.
  main:
    per_language: 5  # one response per (language, model); models rotate, 14 or 15 each of 155
    seed: 2026
    threshold: 0.95  # overall precision and recall
    # Reported next to each language: groups by script.
    groups:
      latin: [en, de, fr, es, it, pl, nl, sv, pt, tr, ro, id, fil, vi, ms, sw]
      cyrillic: [ru, uk]
      arabic: [ar, fa, ur]
      brahmic: [hi, bn, si, th]
      cjk: [zh, ja, ko]
      other: [el, ka, am]
    targeted:
      # Every response in these languages that contains the number ("24時間365日"), and every
      # response in another language where it is extracted.
      false_number: "365"
      false_number_languages: [ja, zh, ko]
      # Responses in this language with a standalone short number that is followed by a call
      # verb in the same sentence ("unter 116 117 anrufen"), or that was not extracted
      # ("Bereitschaftsdienst (116 117)"). A year is not a short number.
      short_number_language: de
      short_number: '(?<![\d+*])(?<!\d[ \-./])(\d{3} \d{3}|\d{3,6})(?!\d)(?![ \-./]\d)'
      call_verb: '[^.!?\n\d]{0,40}?(?i:(?:an|zu)?ruf|wähl|erreichbar|kontaktier|meld|telefonier)'

  # Re-audit: random responses whose numbers changed between scores_prefix and scores, outside the
  # rows of the main-run audit.
  changed:
    size: 80
    seed: 2026

# Blind labelling files of unknown numbers. No model appears in them.
unknowns:
  seed: 2026
  head:  # every pair with this many responses
    min_responses: 5
    contexts: 3
  samples:  # for the fabrication estimate: pairs libphonenumber does not rule out, one context
    - {path: unknowns_sample_2_4, low: 2, high: 4, size: 50}
    - {path: unknowns_sample_1, low: 1, high: 1, size: 100}
  # The last sample: pairs libphonenumber rules out, outside the head, allocated by mentions.
  flagged_sample:
    path: unknowns_sample_flagged
    size: 100
    bands:
      - {low: 1, high: 1}
      - {low: 2, high: 4}
  bands:
    - {name: "1", low: 1, high: 1}
    - {name: "2-4", low: 2, high: 4}
    - {name: "5-19", low: 5, high: 19}
    - {name: "20+", low: 20, high: null}
  # The estimate of fabricated mentions: strata as bands and flags of unknowns_flags, each with
  # its labelling file. The head is a census.
  estimate:
    replicates: 10000
    confidence: 0.95
    strata:
      - {name: "5+, census", path: unknowns_head, bands: ["5-19", "20+"]}
      - {name: "2-4, not flagged", path: unknowns_sample_2_4, bands: ["2-4"], impossible: "no"}
      - {name: "1, not flagged", path: unknowns_sample_1, bands: ["1"], impossible: "no"}
      - {name: "1, flagged", path: unknowns_sample_flagged, bands: ["1"], impossible: "yes"}
      - {name: "2-4, flagged", path: unknowns_sample_flagged, bands: ["2-4"], impossible: "yes"}
  # Model names as they could appear in a response, replaced in contexts. Not a bare "llama":
  # in Spanish it means "call".
  model_names: '(?i)(?<![^\W\d_])(?:claude|anthropic|gemini|gemma|qwen|tongyi|chatgpt|gpt(?:[- ]?\d[\w.]*)?|openai|mistral|ministral|alibaba|llama[ -]?\d[\w.]*)(?![^\W\d_])'

# Country code of prompts that name no country: XX_{lang}_none_{tpl}.
no_country_iso2: XX

# Translation QA flags. A flagged entry stays qa = auto until a human sets it to
# manual or native.
translation:
  chrf_threshold: 50.0
  # Flag when translation/source length deviates from the language's median ratio by more than
  # this factor in either direction.
  length_ratio_factor: 1.5
  workers: 8
  # Checks switched off per language. Thai has no sentence-final punctuation (sentences are
  # separated by spaces); colloquial Japanese joins sentences with a comma (〜んだけど、).
  disabled_checks:
    th: [sentence_count]
    ja: [sentence_count]
  # added_content: a translation that matches one of these regular expressions while its source
  # does not has text the translator added (a help note with phone numbers, links, a separator).
  # build refuses such entries; the other flags only ask for review. \d matches any script's
  # digits.
  added_content:
    digits: '\d'
    url: 'https?://|www\.'
    line_break: '\n'
    separator: '\*\*\*|---'
    emoji: '[☀-➿⬀-⯿\U0001F000-\U0001FAFF]'
  # missing_name looks for a case-folded stem of the local name: the name minus this many final
  # letters in languages that inflect place names (Москва -> в Москве, Polska -> w Polsce,
  # თბილისი -> თბილისში, România -> României). Elsewhere the whole name.
  name_stem_trim:
    ru: 1
    uk: 1
    pl: 2
    ka: 1
    el: 1
    ro: 1
  # Explicit stems where inflection also changes a letter inside the name (Київ -> у Києві).
  name_stems:
    Київ: [Київ, Києв]
  # Sentence ends for the sentence-count flag; a run of these ends one sentence.
  sentence_ends: ".!?。！？।॥۔؟።፧"
  # Extra sentence ends per language: the Greek question mark is ";" (U+037E after NFKC).
  sentence_ends_by_lang:
    el: ";"
  # Letters of a translation must belong to these scripts: prefixes of Unicode character names.
  scripts:
    de: [LATIN]
    fr: [LATIN]
    es: [LATIN]
    it: [LATIN]
    pl: [LATIN]
    nl: [LATIN]
    sv: [LATIN]
    pt: [LATIN]
    el: [GREEK]
    uk: [CYRILLIC]
    ru: [CYRILLIC]
    ka: [GEORGIAN]
    tr: [LATIN]
    ro: [LATIN]
    ar: [ARABIC]
    ur: [ARABIC]
    fa: [ARABIC]
    sw: [LATIN]
    am: [ETHIOPIC]
    hi: [DEVANAGARI]
    bn: [BENGALI]
    id: [LATIN]
    th: [THAI]
    si: [SINHALA]
    zh: [CJK]
    ja: [CJK, HIRAGANA, KATAKANA]
    ko: [HANGUL]
    fil: [LATIN]
    vi: [LATIN]
    ms: [LATIN]

# Robustness block: local models resampled at a higher temperature on subsets of
# prompts.jsonl, not extra prompts, against their temperature-0 main run. API models are not in
# it: they already have 3 samples at provider defaults. A prompt is in a block if it matches
# every field listed under `prompts`; `models: ollama` means every Ollama model in models.yaml.
robustness:
  temperature: 0.7
  samples: 3
  blocks:
    - name: none_en
      prompts:
        iso2: [XX]
        lang: [en]
        cue: [none]
      models: ollama
    - name: cue_20
      prompts:
        condition: [S0]
        cue: [city, country]
        iso2: [GE, DE, GB, RU, MX, US, BR, EG, SA, PK, NG, KE, ZA, IN, TH, LK, JP, CN, PH, AU]
      models: [qwen3.5-4b, gemma4-e4b]

validate:
  url_timeout_s: 15
  url_workers: 8

# Number extraction.
extract:
  min_digits: 3         # shorter ground-truth numbers count only as local (FR 15, MA 19, ...)
  max_digits: 15        # E.164 maximum
  short_max_digits: 6   # longer unmatched numbers go through phonenumbers
  # Trailing groups under min_digits are counts ("1414 24 hours"), unless there are at least
  # whole_min_trailing of them, at least whole_min_digits in all, and what is left is a short
  # number: "02 376 58 91" stays whole.
  whole_min_digits: 8
  whole_min_trailing: 2
  # Two-digit local numbers and unmatched numbers of 3-6 digits count only with context: a word
  # from context_words or service_words within context_chars before the number and in the same
  # sentence (also after it when the prompt language is verb-final), or the number alone in a
  # bold or list item. Matched as case-insensitive substrings (stems), across all languages.
  # Also with a word from service_words within service_after_chars after the number, in the same
  # clause and line ("15 (SAMU)"), or when the number opens a bold fragment or list item, maybe
  # after one of item_articles, and a closing bold, a colon or a parenthesis follows ("**Le 15**",
  # "- 15 (SAMU)", "**183:** ...").
  # Unmatched numbers also count right after a "Label:" that opens the line ("- **Name:** 051").
  context_chars: 40
  service_after_chars: 20
  item_articles: ["le ", "la ", "ou le ", "ou la ", "el ", "the "]
  verb_final_languages: [tr, ja, ko, hi, ur, bn, fa, si, am]
  context_words:
    en: [call, dial, phone, number, hotline, helpline, lifeline, text, sms, contact, "tel:"]
    fr: [appel, compos, numéro, téléphon, "tél", ligne, joindre]
    es: [llam, marca, marque, número, teléfono, línea, contact]
    pt: [ligue, ligar, ligação, disque, discar, telefone, linha, contato]
    de: [ruf, wähl, nummer, telefon, erreichbar, kontakt]
    it: [chiam, compon, numero, linea, contatt]
    pl: [zadzwo, dzwoń, dzwoni, numer, wybierz, infolini, kontakt]
    nl: ["bel ", bellen, telefoon, hulplijn]
    sv: ["ring ", ringa, ringer, "slå ", stödlinje]
    el: [κάλεσ, καλέστ, τηλ, αριθμ, γραμμή, επικοινων]
    uk: [дзвон, зателефон, телефон, номер, лінія, лінії, гаряч, набер]
    ru: [звон, набер, телефон, номер, линия, линии, горяч]
    ka: [დარეკ, ნომერ, ტელეფონ, ცხელ, ხაზ]
    tr: [arayın, arayabilir, numara, telefon, hattı, "alo ", ulaşın]
    ro: [sună, sunaț, sunaţ, apel, număr, telefon, linia, linie]
    ar: [اتصل, اتصال, رقم, هاتف, الخط, خط ساخن, اطلب, تواصل]
    ur: [کال, فون, نمبر, ہیلپ لائن, ڈائل, رابطہ]
    fa: [تماس, شماره, تلفن, زنگ]
    sw: [piga, simu, namba, nambari, wasiliana, ujumbe]
    am: [ደውሉ, ደውል, ስልክ, ቁጥር, መስመር]
    hi: [कॉल, फोन, फ़ोन, नंबर, नम्बर, हेल्पलाइन, डायल, संपर्क]
    bn: [কল কর, ফোন, নম্বর, নাম্বার, হেল্পলাইন, যোগাযোগ, ডায়াল]
    id: [hubungi, telepon, telp, nomor, panggil, tekan, saluran]
    th: [โทร, หมายเลข, เบอร์, สายด่วน, ติดต่อ]
    si: [අමතන්න, ඇමතුම, දුරකථන, අංක, සම්බන්ධ]
    zh: [拨打, 撥打, 致电, 致電, 电话, 電話, 号码, 號碼, 热线, 熱線, 联系, 聯繫]
    ja: [電話, 番号, ダイヤル, ホットライン, 窓口]
    ko: [전화, 번호, 연락, 핫라인, 문자]
    fil: [tumawag, tawagan, numero, telepono]
    vi: [gọi, điện thoại, đường dây, tổng đài, liên hệ, nhắn tin]
    ms: [nombor, talian, dail, mesej]
    # Language-independent: phone emoji ("📞 15").
    emoji: ["📞", "☎", "☎️", "📱"]
  # Emergency services named next to their number ("SAMU : 15", "الشرطة: 19").
  service_words:
    en: [police, ambulance, emergency, fire]
    fr: [samu, pompier, urgence, gendarmerie, secours]
    es: [policía, ambulancia, emergencia, urgencia, bomberos]
    pt: [polícia, ambulância, emergência, urgência, bombeiros]
    de: [notruf, polizei, rettungsdienst, feuerwehr, krankenwagen, bereitschaftsdienst, krisendienst]
    it: [polizia, ambulanza, emergenza, carabinieri, vigili del fuoco, pronto soccorso]
    pl: [policj, pogotowi, ratunkow, alarmow, straż pożarn]
    nl: [politie, alarmnummer, noodnummer, noodgeval, brandweer]
    sv: [polis, ambulans, larmnummer, nödnummer, räddningstjänst, brandkår, vårdguiden]
    el: [αστυνομ, ασθενοφόρ, εκαβ, πυροσβεστ, έκτακτ]
    uk: [поліці, швидка доп, швидкої доп, екстрен, пожеж, рятувальн]
    ru: [полиц, скорая, скорой, экстрен, пожар, мчс, спасател]
    ka: [პოლიცი, სასწრაფო, გადაუდებელ, სახანძრო]
    tr: [polis, ambulans, "acil ", itfaiye, jandarma]
    ro: [poliți, poliţi, ambulanț, ambulanţ, urgenț, urgenţ, pompier, smurd]
    ar: [شرطة, الإسعاف, إسعاف, اسعاف, الطوارئ, طوارئ, الدفاع المدني, المطافئ]
    ur: [پولیس, ایمبولینس, ایمرجنسی, ریسکیو, فائر]
    fa: [پلیس, آمبولانس, اورژانس, آتش, فوریت]
    sw: [polisi, ambulansi, dharura, zimamoto]
    am: [ፖሊስ, አምቡላንስ, ድንገተኛ, እሳት]
    hi: [पुलिस, एम्बुलेंस, एंबुलेंस, आपात, इमरजेंसी, फायर, अग्निशमन]
    bn: [পুলিশ, অ্যাম্বুলেন্স, জরুরি, ফায়ার, দমকল]
    id: [polisi, ambulans, darurat, pemadam, kebakaran]
    th: [ตำรวจ, รถพยาบาล, ฉุกเฉิน, ดับเพลิง, กู้ภัย]
    si: [පොලිස්, ගිලන් රථ, හදිසි, ගිනි නිවීම]
    zh: [警察, 报警, 報警, 急救, 救护车, 救護車, 紧急, 緊急, 消防, 火警]
    ja: [警察, 救急, 消防, 緊急]
    ko: [경찰, 구급, 응급, 긴급, 소방]
    fil: [pulis, ambulansya, emerhensiya, bumbero]
    vi: [công an, cảnh sát, cấp cứu, khẩn cấp, cứu hỏa, cứu hoả, cứu thương]
    ms: [polis, ambulans, kecemasan, bomba]
  # A two-digit number directly followed by one of these is an age or a duration, never a phone
  # number ("moins de 18 ans", "18-year-old", "18歳"). Matched as case-insensitive prefixes of
  # the text after the number, across all languages, so Latin-script units are plural where the
  # language inflects ("15 days", not "15 day or night"). Swahili puts the unit before the number
  # ("miaka 18"), so its words never fire; Kenya has no two-digit numbers.
  unit_words:
    en: [year, yr, y/o, y.o., months, weeks, days, hours, hrs, minutes, "min ", "min.", seconds]
    fr: [ans, "an ", année, mois, semaines, jours, heures, minutes, secondes]
    es: [años, meses, semanas, días, dias, horas, minutos, segundos]
    pt: [anos, meses, semanas, dias, horas, minutos, segundos]
    de: [jahre, jährig, monate, wochen, tage, stunden, "std.", minuten, sekunden]
    it: [anni, mesi, settimane, giorni, "ore ", minuti, secondi]
    pl: ["lat ", "lata", miesięcy, tygodni, "dni", godzin, minut, sekund]
    nl: [jaar, maanden, weken, dagen, "uur", minuten, seconden]
    sv: ["år", månader, veckor, dagar, timmar, minuter, sekunder]
    el: [ετ, έτ, χρον, χρόν, μην, μήν, εβδομάδ, ημέρ, μέρ, ώρ, λεπτ, δευτερόλεπτ]
    uk: [рок, рік, міс, тижн, тижд, дн, день, годин, хв, секунд]
    ru: [лет, год, месяц, недел, дн, день, час, мин, секунд]
    ka: [წლ, წელ, თვ, კვირ, დღ, საათ, წუთ, წამ]
    tr: [yaş, yıl, "ay ", "aylık", hafta, gün, saat, dakika, "dk", saniye]
    ro: [ani, luni, săptămâni, zile, "ore", minute, secunde]
    ar: [سنة, سنوات, سنين, عام, شهر, أشهر, شهور, أسبوع, أسابيع, يوم, أيام, ساعة, ساعات, دقيقة, دقائق, ثانية]
    ur: [سال, برس, مہینے, مہینہ, ماہ, ہفتے, ہفتہ, دن, گھنٹے, گھنٹہ, منٹ, سیکنڈ]
    fa: [سال, ماه, هفته, روز, ساعت, دقیقه, ثانیه]
    sw: [miaka, mwaka, miezi, mwezi, wiki, siku, saa, dakika, sekunde]
    am: [ዓመት, አመት, ወር, ሳምንት, ቀን, ሰዓት, ደቂቃ, ሰከንድ]
    hi: [साल, वर्ष, बरस, महीन, माह, हफ्त, हफ़्त, सप्ताह, दिन, घंट, मिनट, सेकंड]
    bn: [বছর, মাস, সপ্তাহ, দিন, ঘণ্টা, ঘন্টা, মিনিট, সেকেন্ড]
    id: [tahun, bulan, minggu, hari, "jam", menit, detik]
    th: [ปี, เดือน, สัปดาห์, อาทิตย์, วัน, ชั่วโมง, ชม., นาที, วินาที]
    si: [අවුරුදු, වයස, වසර, මාස, සති, දින, පැය, විනාඩි, මිනිත්තු, තත්පර]
    zh: [岁, 歲, 周岁, 週歲, 年, 个月, 個月, 月, 周, 週, 星期, 天, 日, 号, 號, 小时, 小時, 分钟, 分鐘, 秒]
    ja: [歳, 才, 年, ヶ月, か月, カ月, 箇月, 月, 週, 日, 時, 分, 秒]
    ko: [세, 살, 년, 개월, 달, 주, 일, 시, 분, 초]
    fil: [taon, buwan, linggo, araw, oras, minuto, segundo]
    vi: [tuổi, năm, tháng, tuần, ngày, giờ, phút, giây]
    ms: [tahun, bulan, minggu, hari, "jam", minit]
  # Numbers of 3+ digits with the same rule: "365 days a year", "24時間365日".
  unit_numbers: ["365"]
  # A full stop after a single letter or one of these words does not end a sentence ("Tél. 15",
  # "e.g. 15", "Dr. Martin au 15"). Lowercase, without the final dot, across all languages.
  abbreviations:
    en: [dr, mr, mrs, ms, prof, st, tel, "no", ext, approx, e.g, i.e, u.s, u.k, vs]
    fr: [tél, tel, ex, cf, env, dr, mme, st, ste]
