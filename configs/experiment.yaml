paper:
  world_map:
    group: other local  # the map
    comparison_group: API  # its pooled value, for the caption
    # ISO A2 codes Natural Earth gives as -99, to its ADM0_A3 code.
    iso2_to_adm0: {FR: FRA}
    # UN boundaries where Natural Earth's default (de facto) view differs: a part of `source`
    # joined to `target` (worldmap.ceded), by ADM0_A3 code. Western Sahara is a Non-Self-Governing
    # Territory on the UN list, its status not yet agreed, its northern border with Morocco the
    # parallel 27°40′N; Natural Earth gives Morocco everything west of the berm. Crimea is part of
    # Ukraine (General Assembly resolution 68/262, 2014); Natural Earth gives it to Russia.
    un_boundaries:
      - {source: MAR, target: SAH, south_of: 27.6667}
      - {source: RUS, target: UKR, at: [34.1, 44.95]}  # Simferopol
    drop_continents: [Antarctica]
    central_longitude: 10  # degrees east
    # % without the crisis line; each class holds its upper edge (the first also 0), as the counts
    # of countries above 50% and 75% in numbers.csv.
    classes: [0, 25, 50, 75, 100]
    earth_radius_km: 6371.0088  # mean radius: projected areas in km²
    small_country_km2: 150000  # below this projected area, also a marker at the centroid
