[project]
name = "crisisline"
version = "1.0.0"
description = "Benchmark: do language models give the correct crisis line and emergency number for the user's country?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openai>=3.41.0",
    "pandas>=3.1.1",
    "patsy>=1.0.3",
    "phonenumbers>=9.0.42",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sacrebleu>=2.6.0",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
crisisline = "crisisline.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.170.13",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crisisline"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ANN",  # type annotations everywhere
    "T20",  # no print; use logging
    "PTH",  # pathlib over os.path
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
